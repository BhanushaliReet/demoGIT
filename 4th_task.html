<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2</title>
  <style>
    /* Center the card on the page */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    /* Container for the card */
    .card {
      width: 500px;
      display: flex;
      flex-direction: column;
    }

    /* Landscape image */
    .card img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Gradient button / banner */
    .gradient-btn {
      width: 100%;
      padding: 16px 0;
      border: 1px solid #111;
      box-sizing: border-box;
      /* Left-to-right gradient from orange/yellow to vibrant green */
      background: linear-gradient(to right, #ffb300, #4cd934);
      color: #ffffff;
      font-size: 20px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Replace the src URL with your local image file if needed -->
    <img 
      src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" 
      alt="Mountain Lake Landscape"
    />
    <div class="gradient-btn">Click Me</div>
  </div>

</body>
</html>
