<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laundry Mart - Login</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Full-screen Flex Container (100vh) -->
  <div class="login-wrapper">

    <!-- Left Section: Blue Background + Centered Illustration -->
    <div class="left-section">
      <img 
        src="https://illustrations.popsy.co/amber/shampoo-and-washing.svg" 
        alt="Laundry Illustration" 
        class="laundry-img"
      >
    </div>

    <!-- Right Section: Login Form -->
    <div class="right-section">
      <div class="form-container">
        
        <div class="form-header">
          <h2>Hello Again!</h2>
          <p>Welcome back! we missed you!</p>
        </div>

        <form class="login-form">
          <div class="input-group">
            <label for="email">Email</label>
            <input 
              type="email" 
              id="email" 
              placeholder="Emailid@site.com" 
              required
            >
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              placeholder="Password" 
              required
            >
          </div>

          <div class="forgot-password">
            <a href="#forgot">Forgot Password</a>
          </div>

          <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="form-footer">
          <p>Not a member? <a href="#register">Register Now</a></p>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
